# Host port can be overridden without editing this file, e.g.  PORTFOLIO_PORT=5108 make start-development
name: portfolio-development
services:
  portfolio-dev:
    build:
      context: ../../
      dockerfile: docker/Dockerfile
    image: portfolio-dev
    container_name: portfolio-dev
    ports:
      - "${PORTFOLIO_PORT:-5006}:80"
    restart: unless-stopped
