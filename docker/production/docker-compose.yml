# Host port can be overridden without editing this file, e.g.  PORTFOLIO_PORT=5108 make start-production
name: portfolio-production
services:
  portfolio-prod:
    build:
      context: ../../
      dockerfile: docker/Dockerfile
    image: portfolio-prod
    container_name: portfolio-prod
    ports:
      - "${PORTFOLIO_PORT:-5008}:80"
    restart: unless-stopped
