# Host port can be overridden without editing this file, e.g.  PORTFOLIO_PORT=5108 make start-staging
name: portfolio-staging
services:
  portfolio-staging:
    build:
      context: ../../
      dockerfile: docker/Dockerfile
    image: portfolio-staging
    container_name: portfolio-staging
    ports:
      - "${PORTFOLIO_PORT:-5007}:80"
    restart: unless-stopped
